name: Install integration brand icon
on:
  push:
    paths:
      - .github/icon256.b64
permissions:
  contents: write
jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Decode brand icon
        run: |
          mkdir -p custom_components/teltonika_mqtt/brand
          base64 -d .github/icon256.b64 > custom_components/teltonika_mqtt/brand/icon.png
      - name: Commit brand icon
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add custom_components/teltonika_mqtt/brand/icon.png
          git commit -m "Add Teltonika MQTT integration icon"
          git push
